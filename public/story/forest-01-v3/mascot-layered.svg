<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="mascot-title mascot-desc">
  <title id="mascot-title">School capybara — editable v6 motion candidate</title>
  <desc id="mascot-desc">A friendly upright capybara with a broad warm face, two eyes, two whiskers on each cheek, two arms and two feet. Navy cap and uniform, ivory shirt and teal neckerchief.</desc>
